## 2. Las 5 Estrategias de Evaluación

### Estrategia 1: End-to-End Evals con Dataset
Evalúa la calidad global. Usar 20+ casos cubriendo:
- Financiero simple / Mixto
- Institucional (RAG)
- Regla VALIDA NOMBRES
- Identidad / context

### Estrategia 2: Component-Level Evals
Evaluar cada nodo aisladamente:
- **Planner:** ¿Usa tools correctas? ¿Maneja multi-pregunta?
- **Executor:** ¿Sin errores y en tiempo (<30s)?
- **Reflector:** ¿Valida correctamente?
- **Responder:** ¿Tono amigable y empático?

### Estrategia 3: Error Analysis (Spreadsheet)
Metodología de inspeccionar trazas de fallos y clasificar qué componente falló (Planner, Executor, etc.) para priorizar mejoras.

### Estrategia 4: Métricas de Costo y Latencia
Tracking de tokens y tiempos por nodo.
- Alerta: >15s respuesta o >10k tokens por consulta.

### Estrategia 5: Proceso Iterativo Build ↔ Analyze
No es un proceso lineal. Ejecutar tests -> Analizar -> Ajustar Prompts -> Repetir.

---

## 3. Resumen Ejecutivo: Plan de Acción
